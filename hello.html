<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Sudoku</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap">
    <style>
        :root {
            --bg: #E8EDF1;
            --card: #fff;
            --ink: #14213D;
            --mute: #5F6F86;
            --line: #C5CFDA;
            --box: #14213D;
            --sel: #FFD166;
            --peer: #E3ECF7;
            --same: #BFD8F5;
            --user: #0B7A75;
            --err: #D62839;
            --errbg: #FDE3E5;
            --btn: #F2F5F8;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        @media (prefers-color-scheme:dark) {
            :root:not([data-theme="light"]) {
                --bg: #0E1420;
                --card: #161E2E;
                --ink: #E8EEF7;
                --mute: #8FA0B8;
                --line: #2A3650;
                --box: #8FA0B8;
                --sel: #8A6A12;
                --peer: #1D283D;
                --same: #27406A;
                --user: #4FD1C5;
                --err: #FF6B6B;
                --errbg: #3A1D24;
                --btn: #1E2940
            }
        }

        :root[data-theme="dark"] {
            --bg: #0E1420;
            --card: #161E2E;
            --ink: #E8EEF7;
            --mute: #8FA0B8;
            --line: #2A3650;
            --box: #8FA0B8;
            --sel: #8A6A12;
            --peer: #1D283D;
            --same: #27406A;
            --user: #4FD1C5;
            --err: #FF6B6B;
            --errbg: #3A1D24;
            --btn: #1E2940
        }

        html {
            scroll-padding-top: env(safe-area-inset-top, 0px)
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font-family: "Outfit", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center
        }

        button {
            font: inherit;
            color: inherit;
            cursor: pointer
        }

        button:focus-visible {
            outline: 3px solid var(--user);
            outline-offset: 2px
        }

        .app {
            width: 100%;
            max-width: 960px;
            padding: 20px 16px 32px;
            display: grid;
            gap: 14px;
            grid-template-areas: "head" "levels" "board" "toast" "pad" "tools";
            justify-items: center
        }

        header {
            grid-area: head;
            width: min(100%, 460px);
            display: flex;
            justify-content: space-between;
            align-items: baseline
        }

        h1 {
            margin: 0;
            font-size: clamp(34px, 8vw, 48px);
            font-weight: 700;
            letter-spacing: -.03em;
            line-height: 1
        }

        .meta {
            display: flex;
            gap: 14px;
            color: var(--mute);
            font-size: 15px;
            font-variant-numeric: tabular-nums
        }

        .meta b {
            color: var(--ink);
            font-weight: 600
        }

        .levels {
            grid-area: levels;
            display: flex;
            gap: 4px;
            padding: 4px;
            background: var(--card);
            border-radius: 12px;
            width: min(100%, 460px)
        }

        .levels button {
            flex: 1;
            border: 0;
            background: none;
            padding: 9px 4px;
            border-radius: 9px;
            font-weight: 500;
            font-size: 14px;
            color: var(--mute)
        }

        .levels button[aria-pressed="true"] {
            background: var(--ink);
            color: var(--card)
        }

        .board {
            grid-area: board;
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            width: min(100%, 460px);
            aspect-ratio: 1;
            background: var(--card);
            border: 2px solid var(--box);
            border-radius: 6px;
            overflow: hidden
        }

        .cell {
            border: 0;
            border-right: 1px solid var(--line);
            border-bottom: 1px solid var(--line);
            background: var(--card);
            padding: 0;
            font-size: clamp(18px, 5.8vw, 28px);
            font-weight: 500;
            font-variant-numeric: tabular-nums;
            color: var(--user);
            transition: background .12s
        }

        .cell.fixed {
            color: var(--ink);
            font-weight: 700
        }

        .cell.cr {
            border-right: 2px solid var(--box)
        }

        .cell.br {
            border-bottom: 2px solid var(--box)
        }

        .cell.c8 {
            border-right: 0
        }

        .cell.r8 {
            border-bottom: 0
        }

        .cell.peer {
            background: var(--peer)
        }

        .cell.same {
            background: var(--same)
        }

        .cell.sel {
            background: var(--sel);
            color: var(--ink)
        }

        .cell.wrong {
            background: var(--errbg);
            color: var(--err)
        }

        .cell.shake {
            animation: shake .3s
        }

        @keyframes shake {
            25% {
                transform: translateX(-3px)
            }

            75% {
                transform: translateX(3px)
            }
        }

        #toast {
            grid-area: toast;
            min-height: 22px;
            font-size: 15px;
            color: var(--mute);
            text-align: center
        }

        #toast.err {
            color: var(--err);
            font-weight: 500
        }

        #toast.ok {
            color: var(--user);
            font-weight: 500
        }

        .pad {
            grid-area: pad;
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            gap: 6px;
            width: min(100%, 460px)
        }

        .pad button {
            aspect-ratio: 3/4;
            border: 0;
            border-radius: 10px;
            background: var(--card);
            font-size: clamp(18px, 5vw, 24px);
            font-weight: 600;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px
        }

        .pad button small {
            font-size: 11px;
            font-weight: 400;
            color: var(--mute)
        }

        .pad button:disabled {
            opacity: .3;
            cursor: default
        }

        .tools {
            grid-area: tools;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            width: min(100%, 460px)
        }

        .tools button {
            border: 1px solid var(--line);
            background: var(--btn);
            border-radius: 10px;
            padding: 11px 4px;
            font-weight: 500;
            font-size: 15px
        }

        .pad button:hover:not(:disabled),
        .tools button:hover,
        .levels button:hover {
            filter: brightness(.96)
        }

        #win {
            position: fixed;
            inset: 0;
            background: rgba(10, 16, 28, .6);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px
        }

        #win[hidden] {
            display: none
        }

        .win-card {
            background: var(--card);
            border-radius: 16px;
            padding: 28px;
            max-width: 340px;
            width: 100%;
            text-align: center
        }

        .win-card h2 {
            margin: 0 0 6px;
            font-size: 28px;
            letter-spacing: -.02em
        }

        .win-card p {
            margin: 0 0 20px;
            color: var(--mute);
            line-height: 1.5
        }

        .win-card button {
            border: 0;
            background: var(--ink);
            color: var(--card);
            padding: 12px 22px;
            border-radius: 10px;
            font-weight: 600
        }

        @media (min-width:820px) {
            .app {
                grid-template-columns: 460px 340px;
                grid-template-areas: "head head" "levels levels" "board pad" "board tools" "toast toast";
                justify-content: center;
                align-content: start;
                column-gap: 36px;
                justify-items: stretch
            }

            header,
            .levels {
                grid-column: 1/-1;
                width: auto;
                justify-self: start;
                width: 460px
            }

            .pad,
            .tools {
                width: 100%;
                align-self: start
            }

            .pad {
                grid-template-columns: repeat(3, 1fr);
                gap: 10px
            }

            .pad button {
                aspect-ratio: auto;
                height: 72px;
                flex-direction: row;
                gap: 8px
            }

            .tools {
                grid-template-columns: repeat(2, 1fr);
                margin-top: 6px;
                align-self: start
            }

            #toast {
                text-align: left
            }
        }

        @media (prefers-reduced-motion:reduce) {

            .cell,
            .cell.shake {
                transition: none;
                animation: none
            }
        }
    </style>
</head>

<body>
    <main class="app">
        <header>
            <h1>Sudoku</h1>
            <div class="meta"><span>Time <b id="time">00:00</b></span><span>Empty <b id="left">0</b></span></div>
        </header>
        <div class="levels" role="group" aria-label="Puzzle">
            <button data-level="classic">Classic</button>
            <button data-level="easy">Easy</button>
            <button data-level="medium">Medium</button>
            <button data-level="hard">Hard</button>
        </div>
        <div id="board" class="board" role="grid" aria-label="Sudoku board"></div>
        <div id="toast" role="status" aria-live="polite"></div>
        <div id="pad" class="pad"></div>
        <div class="tools">
            <button id="undo">Undo</button>
            <button id="erase">Erase</button>
            <button id="hint">Hint</button>
            <button id="check">Check</button>
        </div>
        <div id="win" hidden>
            <div class="win-card" role="dialog" aria-modal="true" aria-labelledby="wt">
                <h2 id="wt">Solved!</h2>
                <p id="wsum"></p>
                <button id="again">New puzzle</button>
            </div>
        </div>
    </main>
    <script>
        const $ = s => document.querySelector(s);
        const CLASSIC = "530070000600195000098000060800060003400803001700020006060000280000419005000080079";
        const CLUES = { easy: 40, medium: 32, hard: 26 };

        /* ---------- rules + solver (flat 81-cell arrays) ---------- */
        function conflicts(b, r, c, n) {
            for (let k = 0; k < 9; k++) {
                if (k !== c && b[r * 9 + k] === n) return true;
                if (k !== r && b[k * 9 + c] === n) return true;
            }
            const br = r - r % 3, bc = c - c % 3;
            for (let i = br; i < br + 3; i++)
                for (let j = bc; j < bc + 3; j++)
                    if ((i !== r || j !== c) && b[i * 9 + j] === n) return true;
            return false;
        }
        function cands(b, i) {
            const r = (i / 9) | 0, c = i % 9, out = [];
            for (let n = 1; n <= 9; n++) if (!conflicts(b, r, c, n)) out.push(n);
            return out;
        }
        function bestEmpty(b) {
            let best = null;
            for (let i = 0; i < 81; i++) {
                if (b[i] === 0) {
                    const cs = cands(b, i);
                    if (!best || cs.length < best.cs.length) { best = { i, cs }; if (cs.length <= 1) return best; }
                }
            }
            return best;
        }
        function shuffle(a) {
            for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));[a[i], a[j]] = [a[j], a[i]]; }
            return a;
        }
        function solve(b, rnd) {
            const s = bestEmpty(b);
            if (!s) return true;
            const list = rnd ? shuffle(s.cs) : s.cs;
            for (const n of list) { b[s.i] = n; if (solve(b, rnd)) return true; }
            b[s.i] = 0;
            return false;
        }
        function countSolutions(b, limit) {
            const s = bestEmpty(b);
            if (!s) return 1;
            let total = 0;
            for (const n of s.cs) {
                b[s.i] = n;
                total += countSolutions(b, limit - total);
                if (total >= limit) break;
            }
            b[s.i] = 0;
            return total;
        }
        function generate(clues) {
            const sol = new Array(81).fill(0);
            solve(sol, true);
            const p = sol.slice();
            let filled = 81;
            for (const i of shuffle([...Array(81).keys()])) {
                if (filled <= clues) break;
                const keep = p[i];
                p[i] = 0;
                if (countSolutions(p.slice(), 2) === 1) filled--; else p[i] = keep;
            }
            return [p, sol];
        }

        /* ---------- game state ---------- */
        let G = null, timer = null;
        const cells = [];

        function buildBoard() {
            const board = $("#board");
            for (let i = 0; i < 81; i++) {
                const r = (i / 9) | 0, c = i % 9;
                const b = document.createElement("button");
                b.className = "cell" + (c % 3 === 2 ? " cr" : "") + (r % 3 === 2 ? " br" : "") + (c === 8 ? " c8" : "") + (r === 8 ? " r8" : "");
                b.setAttribute("role", "gridcell");
                b.addEventListener("click", () => select(i));
                board.appendChild(b);
                cells.push(b);
            }
            const pad = $("#pad");
            for (let n = 1; n <= 9; n++) {
                const b = document.createElement("button");
                b.dataset.n = n;
                b.addEventListener("click", () => place(n));
                pad.appendChild(b);
            }
        }

        function newGame(level) {
            clearInterval(timer);
            $("#win").hidden = true;
            document.querySelectorAll(".levels button").forEach(b => b.setAttribute("aria-pressed", b.dataset.level === level));
            say("Generating puzzle…");
            setTimeout(() => {
                let p, sol;
                if (level === "classic") {
                    p = CLASSIC.split("").map(Number);
                    sol = p.slice(); solve(sol, false);
                } else[p, sol] = generate(CLUES[level]);
                G = { b: p.slice(), fixed: p.map(v => v !== 0), sol, sel: -1, hist: [], hints: 0, moves: 0, t0: Date.now(), wrong: false, done: false, level };
                timer = setInterval(tick, 1000);
                tick(); render(); say("Select a cell, then pick a number.");
            }, 30);
        }

        function tick() {
            const s = Math.floor((Date.now() - G.t0) / 1000);
            $("#time").textContent = String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
        }
        function say(msg, cls = "") { const t = $("#toast"); t.textContent = msg; t.className = cls; }

        function render() {
            const sv = G.sel >= 0 ? G.b[G.sel] : 0;
            const sr = (G.sel / 9) | 0, sc = G.sel % 9;
            cells.forEach((el, i) => {
                const v = G.b[i], r = (i / 9) | 0, c = i % 9;
                el.textContent = v || "";
                el.setAttribute("aria-label", `Row ${r + 1}, column ${c + 1}, ${v || "empty"}`);
                const peer = G.sel >= 0 && i !== G.sel && (r === sr || c === sc || ((r / 3 | 0) === (sr / 3 | 0) && (c / 3 | 0) === (sc / 3 | 0)));
                el.classList.toggle("fixed", G.fixed[i]);
                el.classList.toggle("sel", i === G.sel);
                el.classList.toggle("peer", peer);
                el.classList.toggle("same", i !== G.sel && sv !== 0 && v === sv);
                el.classList.toggle("wrong", G.wrong && v !== 0 && v !== G.sol[i]);
            });
            let empty = 0;
            const counts = new Array(10).fill(0);
            G.b.forEach(v => { v ? counts[v]++ : empty++; });
            $("#left").textContent = empty;
            document.querySelectorAll("#pad button").forEach(b => {
                const n = +b.dataset.n;
                b.innerHTML = `${n}<small>${9 - counts[n]}</small>`;
                b.disabled = counts[n] >= 9;
            });
        }

        function select(i) { if (!G) return; G.sel = i; render(); }

        function place(n) {
            if (!G || G.done) return;
            const i = G.sel;
            if (i < 0) return say("Select a cell first.", "err");
            if (G.fixed[i]) return say("That cell is part of the puzzle.", "err");
            if (G.b[i] === n) return;
            if (n && conflicts(G.b, (i / 9) | 0, i % 9, n)) {
                say(`Invalid move: ${n} already exists in that row, column or box.`, "err");
                cells[i].classList.remove("shake"); void cells[i].offsetWidth; cells[i].classList.add("shake");
                return;
            }
            G.hist.push([i, G.b[i]]);
            G.b[i] = n; G.moves++; G.wrong = false;
            say(n ? "" : "Number erased.");
            render();
            if (G.b.every((v, k) => v === G.sol[k])) win();
        }

        function undo() {
            if (!G || G.done) return;
            const h = G.hist.pop();
            if (!h) return say("Nothing to undo.");
            G.b[h[0]] = h[1]; G.sel = h[0]; G.wrong = false;
            say("Move undone."); render();
        }

        function hint() {
            if (!G || G.done) return;
            if (G.b.some((v, i) => v && v !== G.sol[i])) return say("Fix your incorrect numbers first. Press Check to find them.", "err");
            let best = null;
            for (let i = 0; i < 81; i++) if (!G.b[i]) { const n = cands(G.b, i).length; if (!best || n < best.n) best = { i, n }; }
            if (!best) return;
            G.hist.push([best.i, 0]);
            G.b[best.i] = G.sol[best.i]; G.sel = best.i; G.hints++; G.wrong = false;
            say(`Hint: row ${((best.i / 9) | 0) + 1}, column ${best.i % 9 + 1} is ${G.sol[best.i]}.`, "ok");
            render();
            if (G.b.every((v, k) => v === G.sol[k])) win();
        }

        function check() {
            if (!G || G.done) return;
            const bad = G.b.filter((v, i) => v && v !== G.sol[i]).length;
            G.wrong = bad > 0; render();
            bad ? say(`${bad} incorrect number${bad > 1 ? "s" : ""}, marked in red.`, "err") : say("No incorrect numbers so far.", "ok");
        }

        function win() {
            G.done = true; clearInterval(timer);
            $("#wsum").textContent = `Time ${$("#time").textContent}. ${G.moves} moves, ${G.hints} hint${G.hints === 1 ? "" : "s"}.`;
            $("#win").hidden = false;
            $("#again").focus();
        }

        /* ---------- events ---------- */
        document.querySelectorAll(".levels button").forEach(b => b.addEventListener("click", () => newGame(b.dataset.level)));
        $("#undo").onclick = undo;
        $("#erase").onclick = () => place(0);
        $("#hint").onclick = hint;
        $("#check").onclick = check;
        $("#again").onclick = () => newGame(G.level);

        document.addEventListener("keydown", e => {
            if (!G || e.metaKey || e.altKey) return;
            if (e.key >= "1" && e.key <= "9") place(+e.key);
            else if (["0", "Backspace", "Delete"].includes(e.key)) place(0);
            else if ((e.ctrlKey && e.key === "z") || e.key === "u") undo();
            else if (e.key === "h") hint();
            else if (e.key.startsWith("Arrow")) {
                e.preventDefault();
                let i = G.sel < 0 ? 40 : G.sel;
                if (e.key === "ArrowLeft" && i % 9) i--;
                if (e.key === "ArrowRight" && i % 9 < 8) i++;
                if (e.key === "ArrowUp" && i > 8) i -= 9;
                if (e.key === "ArrowDown" && i < 72) i += 9;
                select(i); cells[i].focus();
            }
        });

        buildBoard();
        newGame("classic");
    </script>
</body>

</html>
